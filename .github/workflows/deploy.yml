name: Deploy from Bitbucket Source

on:
    workflow_dispatch:
    push:
        branches:
            - jellybean

concurrency:
    group: production-deploy
    queue: max

jobs:
    Deploy:
        runs-on: ubuntu-latest
        environment: Testing
        permissions:
            contents: write

        steps:
            - name: Checkout GitHub repo (deployment scripts)
              uses: actions/checkout@v4

            # - name: Setup Node
            #   uses: actions/setup-node@v4
            #   with:
            #       node-version: "24"
            #       cache: "npm"

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.4
                  tools: composer:v2
                  coverage: xdebug

            - name: Set-up Git
              run: |
                BRANCH="${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}"
                git config --global user.email "ci@company4.dev"
                git config --global user.name "GitHub CI"
                git fetch origin "$BRANCH"
                git checkout "$BRANCH"

            - name: Configure SSH for Bitbucket
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.BITBUCKET_SSH_KEY }}" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan bitbucket.org >> ~/.ssh/known_hosts

            # - name: Coding standards for local repo
            #   run: |
            #     # NPM
            #     npm install
            #     npx eslint --fix

            #     # PHP
            #     composer install
            #     vendor/bin/rector process --dry-run
            #     vendor/bin/pint --parallel --ansi --no-interaction
            #     vendor/bin/phpstan analyse
            #     vendor/bin/phpcs

            - name: Clone Bitbucket repo
              run: |
                  git clone git@bitbucket.org:jellyhaus/jellybean.git bitbucket-source

            - name: Set-up source
              run: |
                  cd bitbucket-source

                  # Do more stuff

            - name: Create release archive
              run: |
                  cd bitbucket-source
                  zip -r ../release.zip .

            - name: Generate changelog
              id: changelog
              run: |
                # Get the last tag
                LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

                if [ -z "$LAST_TAG" ]; then
                    # No previous tags, get all commits
                    COMMITS=$(git log --pretty=format:"- %s" | head -20)
                else
                    # Get commits since last tag
                    COMMITS=$(git log $LAST_TAG..HEAD --pretty=format:"- %s")
                fi

                # Store in output, handling multiline
                echo "commits<<EOF" >> $GITHUB_OUTPUT
                echo "$COMMITS" >> $GITHUB_OUTPUT
                echo "EOF" >> $GITHUB_OUTPUT

            - name: Bump composer version
              id: version
              run: |
                CURRENT_VERSION=$(node -p "require('./composer.json').version")
                NEXT_VERSION=$(node -e "const v = '$CURRENT_VERSION'.split('.'); v[1]++; console.log(v.join('.'))")
                composer config version $NEXT_VERSION
                VERSION=$(node -p "require('./composer.json').version")
                echo "version=$VERSION" >> $GITHUB_OUTPUT

                # Commit and push the version bump
                git add composer.json
                git commit -m "Bump version to $VERSION"
                git push origin ${{ github.ref_name }}

                # Create and push the tag
                git tag -a "$VERSION" -m "Release $VERSION"
                git push origin "$VERSION"

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                body: ${{ steps.changelog.outputs.commits }}
                draft: false
                prerelease: false
                tag_name: "${{ steps.version.outputs.version }}"
                files: release.zip
